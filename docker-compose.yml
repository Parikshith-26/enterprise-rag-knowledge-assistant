services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: enterprise-rag-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped